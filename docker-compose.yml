services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: liferpg
      POSTGRES_PASSWORD: liferpg
      POSTGRES_DB: liferpg
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liferpg"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres_test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: liferpg
      POSTGRES_PASSWORD: liferpg
      POSTGRES_DB: liferpg_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  pgdata: